const $=id=>document.getElementById(id),grid=$("grid"),modal=$("modal"),base=toMin(TIMES[0]);
function toMin(t){let[a,b]=t.split(":").map(Number);return a*60+b}
function minToTime(m){m=Math.max(base,Math.min(toMin(TIMES[TIMES.length-1]),Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function ppm(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxm"))}

function attach(el,e){let down=null;el.addEventListener("pointerdown",ev=>{if(ev.button!==undefined&&ev.button!==0)return;const target=ev.target;const mode=target.classList.contains("handle-xy")?"resizeXY":target.classList.contains("handle-x")?"resizeX":target.classList.contains("handle-y")?"resizeY":null;down={x:ev.clientX,y:ev.clientY,mode,moved:false,pointerId:ev.pointerId};if(mode){gesture={id:e.id,mode,startX:ev.clientX,startY:ev.clientY,orig:{day:e.day,start:e.start,end:e.end},el};el.classList.add("resizing");el.setPointerCapture?.(ev.pointerId)}else{el.setPointerCapture?.(ev.pointerId)}ev.stopPropagation()});el.addEventListener("pointermove",ev=>{if(!down)return;const dx=ev.clientX-down.x,dy=ev.clientY-down.y;if(Math.hypot(dx,dy)>7)down.moved=true;if(!down.mode&&down.moved&&!gesture){gesture={id:e.id,mode:"drag",startX:ev.clientX,startY:ev.clientY,orig:{day:e.day,start:e.start,end:e.end},el};el.classList.add("dragging")}if(!gesture||gesture.id!==e.id)return;const g=gesture,deltaMin=Math.round((dx/ppm())/5)*5,deltaY=Math.round(dy/dayH());if(g.mode==="drag"){e.day=Math.max(0,Math.min(4,g.orig.day+deltaY));e.start=minToTime(toMin(g.orig.start)+deltaMin);e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+deltaMin))}else if(g.mode==="resizeX"){e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+deltaMin))}else if(g.mode==="resizeY"){const deltaMinY=Math.round((dy/ppm())/5)*5;e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+deltaMinY))}else if(g.mode==="resizeXY"){const deltaMinY=Math.round((dy/ppm())/5)*5;const combined=Math.round(((deltaMin+deltaMinY)/2)/5)*5;e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+combined))}renderLive(el,e,g.mode)});el.addEventListener("pointerup",ev=>{if(!down)return;if(gesture&&gesture.id===e.id){el.classList.remove("dragging","resizing");gesture=null;save();render()}else if(!down.moved&&!down.mode){const now=Date.now();if(lastTap.id===e.id&&now-lastTap.time<430){lastTap={id:null,time:0};ope $("add").onclick=openNew;$("cancel").onclick=closeSheet;modal.addEventListener("pointerdown",e=>{if(e.target===modal)closeSheet()});$("delete").onclick=()=>{if(editId!==null){events=events.filter(e=>e.id!==editId);save();render();closeSheet()}};$("save").onclick=()=>{const data={day:+$("fDay").value,start:$("fStart").value,end:$("fEnd").value,name:$("fName").value.trim()||"Nová hodina",type:$("fType").value,format:$("fFormat").value.trim(),room:$("fRoom").value.trim(),teacher:$("fTeacher").value.trim(),date:$("fDate").value.trim(),note:$("fNote").value.trim()};if(toMin(data.end)<=toMin(data.start))data.end=minToTime(toMin(data.start)+45);if(editId===null){data.id=events.length?Math.max(...events.map(e=>e.id))+1:1;events.push(data)}else{const i=events.findIndex(e=>e.id===editId);if(i>=0)events[i]={...events[i],...data}}save();render();closeSheet()};
function setupSheet(modalEl,hitEl){let sheetDrag=null;hitEl.addEventListener("pointerdown",e=>{sheetDrag={y:e.clientY};modalEl.querySelector(".box").classList.add("sheet-dragging");hitEl.setPointerCapture?.(e.pointerId);e.stopPropagation()});hitEl.addEventListener("pointermove",e=>{if(!sheetDrag)return;const dy=Math.max(0,e.clientY-sheetDrag.y);modalEl.querySelector(".box").style.transform=`translateY(${dy}px)`});hitEl.addEventListener("pointerup",e=>{if(!sheetDrag)return;const dy=Math.max(0,e.clientY-sheetDrag.y),box=modalEl.querySelector(".box");box.classList.remove("sheet-dragging");if(dy>90){modalEl.classList.remove("open");box.style.transform=""}else box.style.transform="";sheetDrag=null;e.stopPropagation()});hitEl.addEventListener("pointercancel",()=>{sheetDrag=null;const box=modalEl.querySelector(".box");box.classList.remove("sheet-dragging");box.style.transform=""})}
setupSheet(modal,$("grabHit"));
