*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% -10%,#172536 0,#080b10 38%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow-x:hidden}.wrap{padding:8px 7px 20px;min-height:100dvh}.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 3px 11px;background:#080b10e8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #73b7e888}.title{font-size:17px;font-weight:850;letter-spacing:-.035em}.add{width:46px;height:46px;border:1px solid #fff2;border-radius:14px;background:linear-gradient(180deg,#fbfdff,#dce6ef);color:#10151b;font-size:25px;font-weight:800;box-shadow:0 7px 22px #0008;flex:none}.board{position:relative;width:100%;height:calc(100dvh - 76px);min-height:520px;overflow:auto;border:1px solid #fff1;border-radius:17px;background:#0d1218;box-shadow:0 18px 45px #0008;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.grid{position:relative;width:var(--gridw);height:792px;background:linear-gradient(180deg,#111820,#0d1218);touch-action:pan-x pan-y}.corner{position:absolute;left:0;top:0;width:var(--dayw);height:var(--head);background:#0f151d;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:15}.time{position:absolute;top:0;height:var(--head);display:flex;align-items:center;justify-content:center;color:#718093;font-size:9px;font-weight:750;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0f151d;z-index:5}.day{position:absolute;left:0;width:var(--dayw);height:var(--dayh);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:9px;font-weight:900;letter-spacing:.08em;color:#aab6c4;background:#0f151d;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:4}.cell{position:absolute;height:var(--dayh);background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% - 1px),var(--line) calc(100% - 1px),var(--line) 100%),linear-gradient(180deg,#0f151c,#0e1319);border-bottom:1px solid var(--line);pointer-events:none}.event{position:absolute;border-radius:var(--r);padding:8px 8px 9px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;z-index:10;border:1px solid transparent;box-shadow:0 8px 22px #0009;transition:box-shadow .14s,outline .12s;will-change:left,top,width,height;min-width:66px;min-height:58px}.event.dragging{cursor:grabbing;z-index:100;box-shadow:0 18px 40px #000d;transition:none}.event.resizing{z-index:110;box-shadow:0 18px 40px #000d;transition:none}.mine{background:linear-gradient(145deg,var(--mine1),var(--mine2));border-color:#82bce655}.other{background:linear-gradient(145deg,var(--other1),var(--other2));border-color:#db687955}.event.conflict{outline:3px solid var(--bad);box-shadow:0 0 0 6px #ff536d2a,0 18px 40px #000d}.content{height:100%;overflow:hidden;padding-right:1px}.name{font-size:11.5px;font-weight:850;line-height:1.08;letter-spacing:-.025em;overflow-wrap:anywhere;word-break:break-word;display:block}.name.long{font-size:9px;line-height:1.06;letter-spacing:-.018em}.name.xlong{font-size:8px;line-height:1.03;letter-spacing:-.01em}.meta{font-size:8.6px;line-height:1.18;color:#e4ebf2;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.dates{margin-top:3px;font-size:7.8px;line-height:1.15;color:#cbd7e2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.cross{position:absolute;right:6px;top:2px;color:#ff9aaa;font-size:16px;font-weight:900}.handle{position:absolute;z-index:30;touch-action:none}.handle-x{right:0;top:0;bottom:0;width:28px;cursor:ew-resize}.handle-y{left:0;right:28px;bottom:0;height:28px;cursor:ns-resize}.handle-xy{right:0;bottom:0;width:32px;height:32px;cursor:nwse-resize}.handle-x:after{content:"";position:absolute;right:7px;top:calc(50% - 9px);width:2px;height:18px;border-radius:2px;background:#fff7}.handle-y:after{content:"";position:absolute;left:calc(50% - 9px);bottom:7px;width:18px;height:2px;border-radius:2px;background:#fff7}.handle-xy:after{content:"";position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-right:2px solid #fffc;border-bottom:2px solid #fffc}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center;padding:0;z-index:300}.modal.open{display:flex}.box{width:100%;max-height:91dvh;overflow:auto;background:linear-gradient(180deg,#151d27,#10161e);border:1px solid #fff2;border-bottom:0;border-radius:22px 22px 0 0;padding:9px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #000c}.grab{width:38px;height:4px;border-radius:10px;background:#fff3;margin:2px auto 14px}.box h2{margin:0 0 13px;font-size:20px;letter-spacing:-.03em}.badge{display:inline-flex;padding:3px 6px;border-radius:7px;background:#fff1;color:#b8c7d5;font-size:8px;font-weight:800;margin-bottom:6px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field.full{grid-column:1/-1}.form label{display:block;font-size:10px;color:#8f9dad;font-weight:700;margin:0 0 5px}.form input,.form select,.form textarea{width:100%;min-height:44px;border:1px solid #fff2;border-radius:12px;background:#0a0f15;color:var(--text);padding:10px;font:inherit;outline:none}.form textarea{min-height:76px;resize:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#6ca7d877}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}.actions button{min-height:46px;border:0;border-radius:12px;font-weight:850}.cancel{background:#252f3a;color:#fff}.delete{background:#5b2935;color:#fff}.save{background:#eef4f8;color:#10151b}
@media(min-width:701px){:root{--dayw:94px;--dayh:178px;--pxm:1.42px;--gridw:1185px}.wrap{padding:14px}.title{font-size:19px}.board{height:calc(100vh - 86px)}.name{font-size:13px}.name.long{font-size:10.5px}.name.xlong{font-size:9px}.box{width:min(500px,100%);border-bottom:1px solid #fff2;border-radius:18px}.modal{align-items:center;padding:14px}}

<body>
<div class="wrap"><div class="top"><div class="brand"><span class="dot"></span><div class="title">POLM · ZS 2026/27</div></div><button class="add" id="add" aria-label="Pridať hodinu">＋</button></div><div class="board" id="board"><div id="grid" class="grid"></div></div></div>
<div id="modal" class="modal"><div class="box"><div class="grab"></div><div class="badge" id="modalBadge">NOVÁ HODINA</div><h2 id="modalTitle">Pridať hodinu</h2><div class="form"><div class="field full"><label>Predmet</label><input id="fName" autocomplete="off"></div><div class="field"><label>Deň</label><select id="fDay"><option value="0">Pondelok</option><option value="1">Utorok</option><option value="2">Streda</option><option value="3">Štvrtok</option><option value="4">Piatok</option></select></div><div class="field"><label>Označenie</label><select id="fType"><option value="mine">Moja hodina</option><option value="other">×</option></select></div><div class="field"><label>Začiatok</label><select id="fStart"></select></div><div class="field"><label>Koniec</label><select id="fEnd"></select></div><div class="field"><label>P/S</label><input id="fFormat"></div><div class="field"><label>Miestnosť</label><input id="fRoom"></div><div class="field full"><label>Vyučujúci</label><input id="fTeacher"></div><div class="field full"><label>Dátumy</label><input id="fDate"></div><div class="field full"><label>Moja poznámka</label><textarea id="fNote"></textarea></div></div><div class="actions"><button class="cancel" id="cancel">Zrušiť</button><button class="delete" id="delete">Vymazať</button><button class="save" id="save">Uložiť</button></div></div></div>
<script>
const TIMES=["07:10","08:00","08:55","09:45","10:40","11:25","12:25","13:15","14:10","15:00","15:55","16:45","17:35","18:25","19:10","19:55"],DAYS=["PONDELOK","UTOROK","STREDA","ŠTVRTOK","PIATOK"],KEY="polm-events-v4";
const raw=[
{day:0,start:"08:00",end:"08:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"28.09.2026; 16.11.2026"},
{day:0,start:"14:10",end:"14:55",name:"Politická filozofia",type:"mine",format:"S",room:"77 IPO",teacher:"doc. Nataliya Maradyk, PhD."},
{day:1,start:"08:00",end:"08:45",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"29.09.2026"},
{day:1,start:"10:40",end:"11:25",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"20.10.2026; 17.11.2026"},
{day:2,start:"08:55",end:"09:40",name:"Teória demokracie I. (profilový predmet) (PP)",type:"mine",format:"P",room:"186 ISJM",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"10:40",end:"11:25",name:"Tolerancia a intolerancia v politike",type:"mine",format:"P",room:"90 Po",teacher:"doc. PhDr. Irina Dudinská, CSc., univer. prof."},
{day:2,start:"11:25",end:"12:10",name:"Textový seminár k problematike globalizácie",type:"mine",format:"S",room:"369 Po",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"14:10",end:"14:55",name:"Diplomatický protokol a spoločenská etiketa",type:"mine",format:"S",room:"77 IPO",teacher:"Mgr. Gabriel Székely, PhD."},
{day:2,start:"11:25",end:"12:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"P",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:2,start:"12:25",end:"13:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"S",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:3,start:"13:15",end:"14:00",name:"Aplikovaná politológia",type:"mine",format:"P",room:"77 IPO",teacher:"PhDr. Matúš Žac, PhD."},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"S",room:"186 ISJM",teacher:"RNDr. Daniel Kamenský",date:"28.09.2026; 16.11.2026"},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"},
{day:3,start:"15:00",end:"15:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"}
];
let events=JSON.parse(localStorage.getItem(KEY)||"null")||raw.map((x,i)=>({...x,id:i})),editId=null,gesture=null;
const $=id=>document.getElementById(id),grid=$("grid"),modal=$("modal"),base=toMin(TIMES[0]);
function toMin(t){let[a,b]=t.split(":").map(Number);return a*60+b}
function minToTime(m){m=Math.max(base,Math.min(toMin(TIMES[TIMES.length-1]),Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function ppm(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxm"))}
function dayH(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayh"))}
function dayW(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayw"))}
function timeX(t){return dayW()+(toMin(t)-base)*ppm()}
function posY(d,t){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head"))+d*dayH()+(toMin(t)-base)*ppm()}
function titleHeight(e){const len=(e.name||"").length;return Math.max(58,Math.min(148,58+Math.ceil(len/10)*8))}
function hFor(e){return Math.max(titleHeight(e),(toMin(e.end)-toMin(e.start))*ppm())}
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function render(){grid.innerHTML="";const head=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head"));grid.style.height=(head+5*dayH()+20)+"px";grid.appendChild(Object.assign(document.createElement("div"),{className:"corner"}));const step=(toMin(TIMES[1])-toMin(TIMES[0]))*ppm();TIMES.forEach(t=>{const el=document.createElement("div");el.className="time";el.style.left=timeX(t)+"px";el.style.width=step+"px";el.textContent=t;grid.appendChild(el)});DAYS.forEach((d,i)=>{const el=document.createElement("div");el.className="day";el.style.top=(head+i*dayH())+"px";el.textContent=d;grid.appendChild(el);for(let j=0;j<TIMES.length-1;j++){const c=document.createElement("div");c.className="cell";c.style.left=timeX(TIMES[j])+"px";c.style.top=(head+i*dayH())+"px";c.style.width=((toMin(TIMES[j+1])-toMin(TIMES[j]))*ppm())+"px";grid.appendChild(c)}});[...events].sort((a,b)=>a.day-b.day||toMin(a.start)-toMin(b.start)).forEach(renderEvent)}
function renderEvent(e){const el=document.createElement("div");el.className="event "+(e.type||"mine");el.dataset.id=e.id;el.style.left=timeX(e.start)+"px";el.style.top=posY(e.day,e.start)+"px";el.style.width=Math.max(66,(toMin(e.end)-toMin(e.start))*ppm())+"px";el.style.height=hFor(e)+"px";const content=document.createElement("div");content.className="content";const n=document.createElement("div");const len=(e.name||"").length;n.className="name"+(len>78?" xlong":len>48?" long":"");n.textContent=e.name||"Bez názvu";content.appendChild(n);const meta=[e.format,e.room,e.teacher].filter(Boolean).join(" · ");if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;content.appendChild(m)}if(e.date){const d=document.createElement("div");d.className="dates";d.textContent=e.date;content.appendChild(d)}if(e.note){const d=document.createElement("div");d.className="dates";d.textContent=e.note;content.appendChild(d)}el.appendChild(content);if(e.type==="other"){const x=document.createElement("div");x.className="cross";x.textContent="×";el.appendChild(x)}const hx=document.createElement("div");hx.className="handle handle-x";const hy=document.createElement("div");hy.className="handle handle-y";const hxy=document.createElement("div");hxy.className="handle handle-xy";el.append(hx,hy,hxy);grid.appendChild(el);attach(el,e)}
function attach(el,e){let down=null;el.addEventListener("pointerdown",ev=>{if(ev.button!==undefined&&ev.button!==0)return;const target=ev.target;const mode=target.classList.contains("handle-xy")?"resizeXY":target.classList.contains("handle-x")?"resizeX":target.classList.contains("handle-y")?"resizeY":null;down={x:ev.clientX,y:ev.clientY,mode,moved:false};el.setPointerCapture?.(ev.pointerId);if(mode){gesture={id:e.id,mode,startX:ev.clientX,startY:ev.clientY,orig:{day:e.day,start:e.start,end:e.end},el};el.classList.add("resizing")}ev.stopPropagation()});el.addEventListener("pointermove",ev=>{if(!down)return;const dx=ev.clientX-down.x,dy=ev.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>7)down.moved=true;if(!down.mode&&down.moved&&!gesture){gesture={id:e.id,mode:"drag",startX:ev.clientX,startY:ev.clientY,orig:{day:e.day,start:e.start,end:e.end},el};el.classList.add("dragging")}if(!gesture||gesture.id!==e.id)return;const g=gesture,mx=dx/ppm(),my=dy/ppm();if(g.mode==="drag"){e.day=Math.max(0,Math.min(4,g.orig.day+Math.round(my/dayH())));const delta=Math.round(mx/5)*5;e.start=minToTime(toMin(g.orig.start)+delta);e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+delta))}else if(g.mode==="resizeX"||g.mode==="resizeXY"){const delta=Math.round(mx/5)*5;e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+delta))}if(g.mode==="resizeY"){const delta=Math.round(my/5)*5;e.end=minToTime(Math.max(toMin(e.start)+15,toMin(g.orig.end)+delta))}renderLive(el,e,g.mode)});el.addEventListener("pointerup",ev=>{if(!down)return;if(gesture&&gesture.id===e.id){el.classList.remove("dragging","resizing");gesture=null;save();render()}else if(!down.moved&&!down.mode){openEdit(e.id)}down=null;ev.stopPropagation()});el.addEventListener("pointercancel",()=>{if(gesture&&gesture.id===e.id){Object.assign(e,gesture.orig);gesture=null;render()}down=null})}
function renderLive(el,e,mode){el.style.left=timeX(e.start)+"px";el.style.top=posY(e.day,e.start)+"px";if(mode==="resizeX"||mode==="resizeXY")el.style.width=Math.max(66,(toMin(e.end)-toMin(e.start))*ppm())+"px";el.style.height=hFor(e)}
function fillSelects(){$("fStart").innerHTML=TIMES.map(t=>`<option value="${t}">${t}</option>`).join("");$("fEnd").innerHTML=TIMES.map(t=>`<option value="${t}">${t}</option>`).join("")}
function openEdit(id){const e=events.find(x=>x.id===id);if(!e)return;editId=id;$("modalBadge").textContent="UPRAVIŤ HODINU";$("modalTitle").textContent="Upraviť hodinu";$("fName").value=e.name||"";$("fDay").value=e.day;$("fType").value=e.type||"mine";$("fStart").value=e.start;$("fEnd").value=e.end;$("fFormat").value=e.format||"";$("fRoom").value=e.room||"";$("fTeacher").value=e.teacher||"";$("fDate").value=e.date||"";$("fNote").value=e.note||"";$("delete").style.display="block";modal.classList.add("open");setTimeout(()=>$("fName").focus(),80)}
function openNew(){editId=null;$("modalBadge").textContent="NOVÁ HODINA";$("modalTitle").textContent="Pridať hodinu";$("fName").value="";$("fDay").value="0";$("fType").value="mine";$("fStart").value="08:00";$("fEnd").value="08:45";$("fFormat").value="";$("fRoom").value="";$("fTeacher").value="";$("fDate").value="";$("fNote").value="";$("delete").style.display="none";modal.classList.add("open");setTimeout(()=>$("fName").focus(),80)}
$("add").onclick=openNew;$("cancel").onclick=()=>modal.classList.remove("open");modal.addEventListener("pointerdown",e=>{if(e.target===modal)modal.classList.remove("open")});$("delete").onclick=()=>{if(editId!==null){events=events.filter(e=>e.id!==editId);save();render();modal.classList.remove("open")}};$("save").onclick=()=>{const data={day:+$("fDay").value,start:$("fStart").value,end:$("fEnd").value,name:$("fName").value.trim()||"Nová hodina",type:$("fType").value,format:$("fFormat").value.trim(),room:$("fRoom").value.trim(),teacher:$("fTeacher").value.trim(),date:$("fDate").value.trim(),note:$("fNote").value.trim()};if(toMin(data.end)<=toMin(data.start))data.end=minToTime(toMin(data.start)+45);if(editId===null){data.id=events.length?Math.max(...events.map(e=>e.id))+1:1;events.push(data)}else{const i=events.findIndex(e=>e.id===editId);if(i>=0)events[i]={...events[i],...data}}save();render();modal.classList.remove("open")};fillSelects();render();window.addEventListener("resize",render);
</script>
