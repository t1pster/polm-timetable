html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.event{padding-bottom:18px}.name{font-size:15px;line-height:1.03;letter-spacing:-.024em}.name.long{font-size:11.8px;line-height:1.01}.teacher{font-size:9px;line-height:1.04}.info{font-size:7.3px;line-height:1.04}.compact .name{font-size:12.7px}.compact .name.long{font-size:10.9px}.compact .teacher{font-size:8.2px}.compact .info{font-size:6.9px}.moveZone{inset:0 0 18px 0}.hy{height:18px}.hy i{bottom:5px;width:28px;height:3px}
</style></head><body><script src="data.js?v=20260916-6"></script><script src="app.js?v=20260916-12"></script><script>
(()=>{const B=document.getElementById('board'),G=document.getElementById('grid');if(!B||!G)return;const SK='polm-view-scale-v2';let scale=+localStorage.getItem(SK)||1,pointers=new Map,pinch=null,pending=null,synthetic=false;const MIN=.35,MAX=1.35;function base(){return{w:parseFloat(G.dataset.bw)||parseFloat(G.style.width)||0,h:parseFloat(G.dataset.bh)||parseFloat(G.style.height)||0}}function apply(){const b=base();if(!b.w||!b.h)return;G.dataset.bw=b.w;G.dataset.bh=b.h;G.style.width=b.w*scale+'px';G.style.minWidth=b.w*scale+'px';G.style.height=b.h*scale+'px';G.style.minHeight=b.h*scale+'px';G.style.transformOrigin='0 0';G.style.transform='scale('+scale+')'}function cancelPending(){if(pending){clearTimeout(pending.timer);pending=null}}function boardPointers(){return [...pointers.entries()].filter(([,p])=>p.board)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}document.addEventListener('pointerdown',e=>{if(synthetic)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,board:B.contains(e.target)});const bp=boardPointers();if(bp.length>=2){cancelPending();const a=bp[0][1],b=bp[1][1];pinch={d:dist(a,b),z:scale};e.preventDefault();e.stopPropagation();return}const el=e.target.closest?.('.event');if(el){e.preventDefault();e.stopPropagation();cancelPending();pending={el,id:e.pointerId,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{if(!pending||pending.id!==e.pointerId||boardPointers().length!==1)return;synthetic=true;el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,clientX:pending.x,clientY:pending.y,button:0,buttons:1,pointerId:e.pointerId,pointerType:e.pointerType,isPrimary:true}));synthetic=false;pending.active=true},220)}} ,true);
document.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY}if(pinch){const bp=boardPointers();if(bp.length<2)return;const a=bp[0][1],b=bp[1][1];scale=Math.max(MIN,Math.min(MAX,pinch.z*dist(a,b)/pinch.d));localStorage.setItem(SK,String(scale));apply();e.preventDefault();e.stopPropagation();return}if(pending&&pending.id===e.pointerId&&!pending.active&&Math.hypot(e.clientX-pending.x,e.clientY-pending.y)>14){cancelPending()}} ,true);
document.addEventListener('pointerup',e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pinch){if(boardPointers().length<2){pinch=null;apply()}e.preventDefault();e.stopPropagation();return}if(pending&&pending.id===e.pointerId){const q=pending;pending=null;clearTimeout(q.timer);if(!q.active){synthetic=true;q.el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,clientX:e.clientX,clientY:e.clientY,button:0,buttons:1,pointerId:e.pointerId,pointerType:e.pointerType,isPrimary:true}));q.el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,clientX:e.clientX,clientY:e.clientY,button:0,buttons:0,pointerId:e.pointerId,pointerType:e.pointerType,isPrimary:true}));synthetic=false}}},true);document.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);cancelPending();if(pinch){pinch=null;apply()}},true);new MutationObserver(()=>requestAnimationFrame(apply)).observe(G,{childList:true});window.addEventListener('resize',()=>requestAnimationFrame(apply));requestAnimationFrame(apply)})();
</script></body></html>
