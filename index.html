<!doctype html>

<style>
:root{--bg:#080b10;--panel:#0e131a;--panel2:#121923;--line:#202a35;--text:#f5f7fa;--muted:#8997a8;--accent:#79bdf0;--mine1:#24435f;--mine2:#3a719b;--other1:#47232f;--other2:#713847;--bad:#ff536d;--dayw:76px;--head:42px;--dayh:150px;--pxm:1.05px;--r:13px;--gridw:878px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% -10%,#172536 0,#080b10 38%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow-x:hidden}.wrap{padding:8px 7px 20px;min-height:100dvh}.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 3px 11px;background:#080b10e8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #73b7e888}.title{font-size:17px;font-weight:850;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);margin-top:2px}.add{width:46px;height:46px;border:1px solid #fff2;border-radius:14px;background:linear-gradient(180deg,#fbfdff,#dce6ef);color:#10151b;font-size:25px;font-weight:800;box-shadow:0 7px 22px #0008;flex:none}.board{position:relative;width:100%;height:calc(100dvh - 88px);min-height:520px;overflow:auto;border:1px solid #fff1;border-radius:17px;background:#0d1218;box-shadow:0 18px 45px #0008;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.grid{position:relative;width:var(--gridw);height:792px;background:linear-gradient(180deg,#111820,#0d1218);touch-action:pan-x pan-y}.corner{position:absolute;left:0;top:0;width:var(--dayw);height:var(--head);background:#0f151d;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:15}.time{position:absolute;top:0;height:var(--head);display:flex;align-items:center;justify-content:center;color:#718093;font-size:9px;font-weight:750;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0f151d;z-index:5}.day{position:absolute;left:0;width:var(--dayw);height:var(--dayh);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:9px;font-weight:900;letter-spacing:.08em;color:#aab6c4;background:#0f151d;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:4}.day.today{color:#8fd0ff;background:#13202b}.cell{position:absolute;height:var(--dayh);background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% - 1px),var(--line) calc(100% - 1px),var(--line) 100%),linear-gradient(180deg,#0f151c,#0e1319);border-bottom:1px solid var(--line);pointer-events:none}.event{position:absolute;border-radius:var(--r);padding:8px 9px 10px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;z-index:10;border:1px solid transparent;box-shadow:0 8px 22px #0009;transition:box-shadow .14s,outline .12s;will-change:left,top,width,height;min-width:66px;min-height:58px}.event.dragging{cursor:grabbing;z-index:100;box-shadow:0 18px 40px #000d;transition:none}.event.resizing{z-index:110;box-shadow:0 18px 40px #000d;transition:none}.mine{background:linear-gradient(145deg,var(--mine1),var(--mine2));border-color:#82bce655}.other{background:linear-gradient(145deg,var(--other1),var(--other2));border-color:#db687955}.event.conflict{outline:3px solid var(--bad);box-shadow:0 0 0 6px #ff536d2a,0 18px 40px #000d}.content{height:100%;overflow:hidden;padding-right:2px}.name{font-size:11.5px;font-weight:850;line-height:1.1;letter-spacing:-.025em;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.meta{font-size:8.8px;line-height:1.22;color:#e4ebf2;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}.dates{margin-top:3px;font-size:8px;line-height:1.18;color:#cbd7e2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.cross{position:absolute;right:6px;top:2px;color:#ff9aaa;font-size:16px;font-weight:900}.handle{position:absolute;z-index:30;touch-action:none}.handle-x{right:0;top:0;bottom:0;width:25px;cursor:ew-resize}.handle-y{left:0;right:25px;bottom:0;height:25px;cursor:ns-resize}.handle-xy{right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize}.handle-x:after{content:"";position:absolute;right:7px;top:calc(50% - 9px);width:2px;height:18px;border-radius:2px;background:#fff7}.handle-y:after{content:"";position:absolute;left:calc(50% - 9px);bottom:7px;width:18px;height:2px;border-radius:2px;background:#fff7}.handle-xy:after{content:"";position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-right:2px solid #fffc;border-bottom:2px solid #fffc}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center;padding:0;z-index:300}.modal.open{display:flex}.box{width:100%;max-height:91dvh;overflow:auto;background:linear-gradient(180deg,#151d27,#10161e);border:1px solid #fff2;border-bottom:0;border-radius:22px 22px 0 0;padding:9px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #000c}.grab{width:38px;height:4px;border-radius:10px;background:#fff3;margin:2px auto 14px}.box h2{margin:0 0 13px;font-size:20px;letter-spacing:-.03em}.hint{font-size:10px;color:#758294;margin:-5px 0 9px}.badge{display:inline-flex;padding:3px 6px;border-radius:7px;background:#fff1;color:#b8c7d5;font-size:8px;font-weight:800;margin-bottom:6px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field.full{grid-column:1/-1}.form label{display:block;font-size:10px;color:#8f9dad;font-weight:700;margin:0 0 5px}.form input,.form select,.form textarea{width:100%;min-height:44px;border:1px solid #fff2;border-radius:12px;background:#0a0f15;color:var(--text);padding:10px;font:inherit;outline:none}.form textarea{min-height:76px;resize:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#6ca7d877}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}.actions button{min-height:46px;border:0;border-radius:12px;font-weight:850}.cancel{background:#252f3a;color:#fff}.delete{background:#5b2935;color:#fff}.save{background:#eef4f8;color:#10151b}
@media(min-width:701px){:root{--dayw:94px;--dayh:178px;--pxm:1.42px;--gridw:1185px}.wrap{padding:14px}.title{font-size:19px}.board{height:calc(100vh - 100px)}.name{font-size:13px}.box{width:min(500px,100%);border-bottom:1px solid #fff2;border-radius:18px}.modal{align-items:center;padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><span class="dot"></span><div><div class="title">POLM · ZS 2026/27</div><div class="sub">ťukni na hodinu · potiahni pre presun · roh pre veľkosť</div></div></div><button class="add" id="add" aria-label="Pridať hodinu">＋</button></div>
  <div class="board" id="board"><div id="grid" class="grid"></div></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="grab"></div><div class="badge" id="modalBadge">NOVÁ HODINA</div><h2 id="modalTitle">Pridať hodinu</h2><div class="hint">Na mobile stačí ťuknúť na kartu. Dlhé názvy sa zobrazia kompaktne.</div>
<div class="form"><div class="field full"><label>Predmet</label><input id="fName" autocomplete="off"></div><div class="field"><label>Deň</label><select id="fDay"><option value="0">Pondelok</option><option value="1">Utorok</option><option value="2">Streda</option><option value="3">Štvrtok</option><option value="4">Piatok</option></select></div><div class="field"><label>Označenie</label><select id="fType"><option value="mine">Moja hodina</option><option value="other">×</option></select></div><div class="field"><label>Začiatok</label><select id="fStart"></select></div><div class="field"><label>Koniec</label><select id="fEnd"></select></div><div class="field"><label>P/S</label><input id="fFormat"></div><div class="field"><label>Miestnosť</label><input id="fRoom"></div><div class="field full"><label>Vyučujúci</label><input id="fTeacher"></div><div class="field full"><label>Dátumy</label><input id="fDate"></div><div class="field full"><label>Moja poznámka</label><textarea id="fNote"></textarea></div></div>
<div class="actions"><button class="cancel" id="cancel">Zrušiť</button><button class="delete" id="delete">Vymazať</button><button class="save" id="save">Uložiť</button></div></div></div>
<script>
const TIMES=["07:10","08:00","08:55","09:45","10:40","11:25","12:25","13:15","14:10","15:00","15:55","16:45","17:35","18:25","19:10","19:55"],DAYS=["PONDELOK","UTOROK","STREDA","ŠTVRTOK","PIATOK"],KEY="polm-events-v4";
const raw=[
{day:0,start:"08:00",end:"08:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"28.09.2026; 16.11.2026"},
{day:0,start:"14:10",end:"14:55",name:"Politická filozofia",type:"mine",format:"S",room:"77 IPO",teacher:"doc. Nataliya Maradyk, PhD."},
{day:1,start:"08:00",end:"08:45",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"29.09.2026"},
{day:1,start:"10:40",end:"11:25",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"20.10.2026; 17.11.2026"},
{day:2,start:"08:55",end:"09:40",name:"Teória demokracie I. (profilový predmet) (PP)",type:"mine",format:"P",room:"186 ISJM",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"10:40",end:"11:25",name:"Tolerancia a intolerancia v politike",type:"mine",format:"P",room:"90 Po",teacher:"doc. PhDr. Irina Dudinská, CSc., univer. prof."},
{day:2,start:"11:25",end:"12:10",name:"Textový seminár k problematike globalizácie",type:"mine",format:"S",room:"369 Po",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"14:10",end:"14:55",name:"Diplomatický protokol a spoločenská etiketa",type:"mine",format:"S",room:"77 IPO",teacher:"Mgr. Gabriel Székely, PhD."},
{day:2,start:"11:25",end:"12:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"P",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:2,start:"12:25",end:"13:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"S",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:3,start:"13:15",end:"14:00",name:"Aplikovaná politológia",type:"mine",format:"P",room:"77 IPO",teacher:"PhDr. Matúš Žac, PhD."},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"S",room:"186 ISJM",teacher:"RNDr. Daniel Kamenský",date:"28.09.2026; 16.11.2026"},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"},
{day:3,start:"15:00",end:"15:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"}
];
let events=JSON.parse(localStorage.getItem(KEY)||"null")||raw.map((x,i)=>({...x,id:i})),editId=null,gesture=null;
const $=id=>document.getElementById(id),grid=$("grid"),modal=$("modal"),base=toMin(TIMES[0]),last=toMin(TIMES[TIMES.length-1]);
function toMin(t){let[a,b]=t.split(":").map(Number);return a*60+b}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function ppm(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxm"))}function dayH(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayh"))}function dayW(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayw"))}function minToTime(m){m=Math.max(base,Math.min(last,Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function conflict(a,b){return a.id!==b.id&&a.day===b.day&&toMin(a.start)<toMin(b.end)&&toMin(a.end)>toMin(b.start)}
function render(){
 grid.innerHTML='<div class="corner"></div>';
 const p=ppm(),w=dayW(),h=dayH();
 TIMES.forEach((t,i)=>{let e=document.createElement('div');e.className='time';e.textContent=t;e.style.left=(w+(toMin(t)-base)*p)+'px';e.style.width=(i<TIMES.length-1?(toMin(TIMES[i+1])-toMin(t))*p:55*p)+'px';grid.appendChild(e)});
 DAYS.forEach((d,di)=>{let y=42+di*h;let e=document.createElement('div');e.className='day'+(new Date().getDay()===di+1?' today':'');e.style.top=y+'px';e.textContent=d;grid.appendChild(e);let c=document.createElement('div');c.className='cell';c.style.left=w+'px';c.style.top=y+'px';c.style.width=(last-base+55)*p+'px';grid.appendChild(c)});
 events.forEach(ev=>{let el=document.createElement('div');el.className='event '+(ev.type==='other'?'other':'mine');if(events.some(x=>conflict(ev,x)))el.classList.add('conflict');let left=w+(toMin(ev.start)-base)*p,top=42+ev.day*h+3,width=Math.max(66,(toMin(ev.end)-toMin(ev.start))*p),height=Math.max(58,ev.height||((h-7)));
 el.style.left=left+'px';el.style.top=top+'px';el.style.width=width+'px';el.style.height=height+'px';el.dataset.id=ev.id;
 el.innerHTML='<div class="content"><div class="name">'+esc(ev.name||'Bez názvu')+'</div><div class="meta">'+esc([ev.format,ev.room,ev.teacher].filter(Boolean).join(' · '))+'</div><div class="dates">'+esc(ev.date||ev.note||'')+'</div></div>'+(ev.type==='other'?'<div class="cross">×</div>':'')+'<div class="handle handle-x"></div><div class="handle handle-y"></div><div class="handle handle-xy"></div>';
 bindEvent(el,ev);grid.appendChild(el)});
}
function bindEvent(el,ev){
 el.addEventListener('pointerdown',e=>{
   const handle=e.target.closest('.handle');gesture={id:ev.id,el,startX:e.clientX,startY:e.clientY,origX:parseFloat(el.style.left),origY:parseFloat(el.style.top),origW:parseFloat(el.style.width),origH:parseFloat(el.style.height),mode:handle?(handle.classList.contains('handle-xy')?'xy':handle.classList.contains('handle-x')?'x':'y'):'move',moved:false};
   if(handle)e.stopPropagation();try{el.setPointerCapture(e.pointerId)}catch{}
 });
 el.addEventListener('pointermove',e=>{
   if(!gesture||gesture.id!==ev.id)return;let dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(Math.hypot(dx,dy)>7)gesture.moved=true;if(!gesture.moved)return;const p=ppm(),h=dayH();
   if(gesture.mode==='move'){let nx=Math.max(dayW(),gesture.origX+dx),ny=Math.max(42,gesture.origY+dy);ev.day=Math.max(0,Math.min(4,Math.round((ny-42-3)/h)));let sm=base+(nx-dayW())/p;sm=Math.max(base,Math.min(last-5,Math.round(sm/5)*5));let dur=Math.max(5,toMin(ev.end)-toMin(ev.start));ev.start=minToTime(sm);ev.end=minToTime(Math.min(last,sm+dur));el.style.left=(dayW()+(sm-base)*p)+'px';el.style.top=(42+ev.day*h+3)+'px';}
   if(gesture.mode==='x'||gesture.mode==='xy'){let nw=Math.max(66,gesture.origW+dx);let nm=base+(gesture.origX-dayW())/p;let ne=nm+nw/p;ne=Math.max(nm+5,Math.min(last,Math.round(ne/5)*5));ev.end=minToTime(ne);el.style.width=Math.max(66,(ne-nm)*p)+'px'}
   if(gesture.mode==='y'||gesture.mode==='xy'){let nh=Math.max(58,gesture.origH+dy);ev.height=nh;el.style.height=nh+'px'}
 });
 el.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==ev.id)return;let g=gesture;gesture=null;if(g.moved){el.classList.remove('dragging','resizing');save();render()}else openEdit(ev.id)});
 el.addEventListener('pointercancel',()=>{gesture=null;render()});
}
function fillSelects(){['fStart','fEnd'].forEach(id=>{$(id).innerHTML=TIMES.map(t=>'<option>'+t+'</option>').join('')})}
function openEdit(id=null){editId=id;let ev=id==null?{day:0,start:'08:00',end:'08:45',name:'',type:'mine',format:'',room:'',teacher:'',date:'',note:''}:events.find(x=>x.id===id);if(!ev)return;$('modalBadge').textContent=id==null?'NOVÁ HODINA':'ÚPRAVA HODINY';$('modalTitle').textContent=id==null?'Pridať hodinu':'Upraviť hodinu';$('fName').value=ev.name||'';$('fDay').value=ev.day;$('fType').value=ev.type||'mine';$('fStart').value=ev.start;$('fEnd').value=ev.end;$('fFormat').value=ev.format||'';$('fRoom').value=ev.room||'';$('fTeacher').value=ev.teacher||'';$('fDate').value=ev.date||'';$('fNote').value=ev.note||'';$('delete').style.visibility=id==null?'hidden':'visible';modal.classList.add('open');setTimeout(()=>$('fName').focus(),80)}
$('add').onclick=()=>openEdit();$('cancel').onclick=()=>modal.classList.remove('open');modal.addEventListener('pointerdown',e=>{if(e.target===modal)modal.classList.remove('open')});$('delete').onclick=()=>{if(editId==null)return;if(confirm('Vymazať túto hodinu?')){events=events.filter(x=>x.id!==editId);save();modal.classList.remove('open');render()}};
$('save').onclick=()=>{let data={name:$('fName').value.trim()||'Bez názvu',day:+$('fDay').value,type:$('fType').value,start:$('fStart').value,end:$('fEnd').value,format:$('fFormat').value.trim(),room:$('fRoom').value.trim(),teacher:$('fTeacher').value.trim(),date:$('fDate').value.trim(),note:$('fNote').value.trim()};if(toMin(data.end)<=toMin(data.start)){alert('Koniec musí byť neskôr ako začiatok.');return}if(editId==null){data.id=Date.now();events.push(data)}else{let i=events.findIndex(x=>x.id===editId);events[i]={...events[i],...data}}save();modal.classList.remove('open');render()};
fillSelects();render();
</script>
</body>
</html>
