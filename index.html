round:#53606d;margin:0 auto 13px}.sheet h2{font-size:20px;margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field label{display:block;color:#8995a4;font-size:10px;font-weight:700;margin:0 0 4px}.field input,.field select,.field textarea{width:100%;border:1px solid #303b48;border-radius:10px;background:#0c1117;color:#f4f7fb;padding:10px;font:inherit;outline:0}.field textarea{min-height:64px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:14px}.actions button{border:0;border-radius:11px;padding:11px;font-weight:850}.cancel{background:#2a333e;color:white}.delete{background:#66313d;color:white}.save{background:#eef3f7;color:#10161d}.hint{color:#778493;font-size:10px;margin:9px 2px 0}@media(min-width:701px){:root{--dayw:94px;--dayh:185px;--ppm:1.42px}.wrap{padding:14px}.title{font-size:19px}}
</style></head><body><div class="wrap"><div class="top"><div class="title">POLM · ZS 2026/27</div><button class="add" id="add">＋ Pridať</button></div><div class="board"><div id="grid" class="grid"></div></div></div><div id="modal" class="modal"><div class="sheet"><div class="bar"></div><h2 id="mt">Nová hodina</h2><div class="form"><div class="field full"><label>Predmet</label><input id="name"></div><div class="field"><label>Deň</label><select id="day"><option value="0">Pondelok</option><option value="1">Utorok</option><option value="2">Streda</option><option value="3">Štvrtok</option><option value="4">Piatok</option></select></div><div class="field"><label>Typ</label><select id="type"><option value="mine">Moja hodina</option><option value="other">×</option></select></div><div class="field"><label>Začiatok</label><select id="start"></select></div><div class="field"><label>Koniec</label><select id="end"></select></div><div class="field"><label>P/S</label><input id="format"></div><div class="field"><label>Miestnosť</label><input id="room"></div><div class="field full"><label>Vyučujúci</label><input id="teacher"></div><div class="field full"><label>Dátumy</label><input id="date"></div><div class="field full"><label>Moja poznámka</label><textarea id="note"></textarea></div></div><div class="actions"><button class="cancel" id="cancel">Zrušiť</button><button class="delete" id="del">Vymazať</button><button class="save" id="save">Uložiť</button></div><div class="hint">Dvojklik = upraviť · okraj = zmeniť veľkosť · dlaždica = presunúť</div></div></div>

let events=JSON.parse(localStorage.getItem(KEY)||"null")||raw.map((x,i)=>({...x,id:i,height:130})),editId=null,g=null;const $=x=>document.getElementById(x),grid=$("grid"),modal=$("modal"),base=toMin(TIMES[0]);function toMin(t){const[a,b]=t.split(":").map(Number);return a*60+b}function tm(m){m=Math.max(toMin(TIMES[0]),Math.min(toMin(TIMES[TIMES.length-1]),Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function ppm(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ppm"))}function dayH(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayh"))}function dayW(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayw"))}function xpos(m){return dayW()+(m-base)*ppm()}function ypos(d){return 40+d*dayH()}function save(){localStorage.setItem(KEY,JSON.stringify(events))}function conflict(e,d,s,en){return events.some(o=>o.id!==e.id&&o.day===d&&s<toMin(o.end)&&en>toMin(o.start))}
function render(){grid.innerHTML="";grid.style.gridTemplateColumns="var(--dayw) "+TIMES.slice(0,-1).map((t,i)=>Math.max(55,(toMin(TIMES[i+1])-toMin(t))*ppm())+"px").join(" ");grid.insertAdjacentHTML("beforeend",'<div class="corner"></div>');TIMES.slice(0,-1).forEach(t=>grid.insertAdjacentHTML("beforeend",`<div class="time">${t}</div>`));DAYS.forEach(d=>{grid.insertAdjacentHTML("beforeend",`<div class="day">${d}</div>`);TIMES.slice(0,-1).forEach(()=>grid.insertAdjacentHTML("beforeend",'<div class="cell"></div>'))});events.forEach(e=>{const s=toMin(e.start),en=toMin(e.end),el=document.createElement("div");el.className=`event ${e.type} ${conflict(e,e.day,s,en)?"conflict":""}`;el.style.left=xpos(s)+"px";el.style.top=ypos(e.day)+"px";el.style.width=Math.max(64,(en-s)*ppm())+"px";el.style.height=Math.max(64,Math.min(dayH()-8,e.height||130))+"px";el.innerHTML=`${e.type==="other"?'<span class="cross">×</span>':""}<div class="content"><div class="name">${esc(e.name)}</div><div class="meta">${esc(e.format)} · ${esc(e.room)}<br>${esc(e.teacher)}</div>${e.date?`<div class="dates">${esc(e.date)}</div>`:""}${e.note?`<div class="dates">• ${esc(e.note)}</div>`:""}</div><div class="grip gx"></div><div class="grip gy"></div><div class="grip gxy"></div>`;grid.appendChild(el);el.addEventListener("dblclick",()=>edit(e.id));el.addEventListener("pointerdown",ev=>start(ev,e,el,"move"));el.querySelector(".gx").addEventListener("pointerdown",ev=>start(ev,e,el,"x"));el.querySelector(".gy").addEventListener("pointerdown",ev=>start(ev,e,el,"y"));el.querySelector(".gxy").addEventListener("pointerdown",ev=>start(ev,e,el,"xy"));})}
function start(ev,e,el,mode){ev.preventDefault();ev.stopPropagation();el.setPointerCapture?.(ev.pointerId);g={e,el,mode,x:ev.clientX,y:ev.clientY,s:toMin(e.start),en:toMin(e.end),d:e.day,h:e.height||130};el.classList.add(mode==="move"?"dragging":"resizing");el.addEventListener("pointermove",move);el.addEventListener("pointerup",finish,{once:true});el.addEventListener("pointercancel",finish,{once:true})}
function move(ev){if(!g)return;const dx=ev.clientX-g.x,dy=ev.clientY-g.y;let s=g.s,en=g.en,d=g.d,h=g.h;if(g.mode==="x"||g.mode==="xy")en=Math.max(s+5,Math.min(toMin(TIMES[TIMES.length-1]),Math.round((g.en+dx/ppm())/5)*5));if(g.mode==="y"||g.mode==="xy")h=Math.max(64,Math.min(dayH()-8,g.h+dy));if(g.mode==="move"){s=Math.max(base,Math.min(toMin(TIMES[TIMES.length-2]),Math.round((g.s+dx/ppm())/5)*5));d=Math.max(0,Math.min(4,g.d+Math.round(dy/dayH())));en=s+(g.en-g.s);g.el.style.left=xpos(s)+"px";g.el.style.top=ypos(d)+"px"}if(g.mode==="x"||g.mode==="xy")g.el.style.width=Math.max(64,(en-s)*ppm())+"px";if(g.mode==="y"||g.mode==="xy")g.el.style.height=h+"px";g.el.classList.toggle("conflict",conflict(g.e,d,s,en));g.preview={s,en,d,h}}
function finish(){if(!g)return;const q=g.preview;if(q){g.e.start=tm(q.s);g.e.end=tm(q.en);g.e.day=q.d;g.e.height=Math.round(q.h);save()}g.el.classList.remove("dragging","resizing");g.el.removeEventListener("pointermove",move);g=null;render()}
function fill(){["start","end"].forEach(id=>$(id).innerHTML=TIMES.map(t=>`<option>${t}</option>`).join(""))}function edit(id){editId=id;openForm(events.find(x=>x.id===id))}function openForm(e){$("mt").textContent=e?"Upraviť hodinu":"Nová hodina";$("name").value=e?.name||"";$("day").value=e?.day??0;$("type").value=e?.type||"mine";$("start").value=e?.start||"08:00";$("end").value=e?.end||"08:45";$("format").value=e?.format||"";$("room").value=e?.room||"";$("teacher").value=e?.teacher||"";$("date").value=e?.date||"";$("note").value=e?.note||"";$("del").style.display=e?"block":"none";modal.classList.add("open")}
$("add").onclick=()=>{editId=null;openForm(null)};$("cancel").onclick=()=>modal.classList.remove("open");$("save").onclick=()=>{let s=$("start").value,en=$("end").value;if(toMin(en)<=toMin(s))en=tm(toMin(s)+45);const d={id:editId??Date.now(),name:$("name").value.trim()||"Nová hodina",day:+$("day").value,type:$("type").value,start:s,end:en,format:$("format").value.trim(),room:$("room").value.trim(),teacher:$("teacher").value.trim(),date:$("date").value.trim(),note:$("note").value.trim(),height:130};if(editId===null)events.push(d);else Object.assign(events.find(x=>x.id===editId),d);save();modal.classList.remove("open");render()};$("del").onclick=()=>{if(editId!==null)events=events.filter(e=>e.id!==editId);save();modal.classList.remove("open");render()};modal.addEventListener("pointerdown",e=>{if(e.target===modal)modal.classList.remove("open")});fill();render();
