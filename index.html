function loadEvents(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x.map((e,i)=>({...e,id:e.id??crypto.randomUUID?.()??String(Date.now()+i)})):raw.map((e,i)=>({...e,id:"seed-"+i}));}catch{return raw.map((e,i)=>({...e,id:"seed-"+i}))}}function saveEvents(){localStorage.setItem(KEY,JSON.stringify(events))}function mins(t){const[a,b]=t.split(":").map(Number);return a*60+b}const base=mins(TIMES[0]);function fmt(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}function snap(m){const a=TIMES.map(mins);let b=a[0],d=Infinity;for(const v of a){const q=Math.abs(v-m);if(q<d){d=q;b=v}}return b}function varPx(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxm"))||1.95}function pxTime(t){return varPx()*(mins(t)-base)}function cleanName(n){return String(n||"").replace(/\s*\(profilový predmet\)/gi,"").replace(/\s*\(PP\)/gi,"").replace(/\s*\.\.\. \(truncated\)/gi,"").trim()}function esc(s){return String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}

function drawEvent(e,dayw,head,dayh,px){const el=document.createElement("div");el.className="event "+(e.type||"mine");el.dataset.id=e.id;const left=dayw+pxTime(e.start),top=head+e.day*dayh+8,width=Math.max(70,(mins(e.end)-mins(e.start))*px),height=Math.min(dayh-16,Math.max(54,dayh-32));el.style.left=left+"px";el.style.top=top+"px";el.style.width=width+"px";el.style.height=height+"px";const n=cleanName(e.name),cls=n.length>65?"xlong":n.length>42?"long":"";el.innerHTML=`<div class="content"><div class="name ${cls}">${esc(n)}</div>${e.teacher?`<div class="teacher">${esc(e.teacher)}</div>`:""}<div class="meta">${e.format?`<span>${esc(e.format)}</span>`:""}${e.room?`<span class="room">${esc(e.room)}</span>`:""}</div>${e.date?`<div class="dates">${esc(e.date)}</div>`:""}</div>${e.type==="other"?'<div class="cross">×</div>':""}<div class="handle handle-x" data-h="x"></div><div class="handle handle-y" data-h="y"></div><div class="handle handle-xy" data-h="xy"></div>`;el.addEventListener("pointerdown",ev=>onPointerDown(ev,e,el));el.addEventListener("pointerup",ev=>onPointerUp(ev,e,el));grid.appendChild(el)}function point(ev){return{x:ev.clientX,y:ev.clientY}}

function openEvent(e){editingId=e.id;$("modalBadge").textContent="UPRAVIŤ HODINU";$("modalTitle").textContent="Upraviť hodinu";$("fName").value=e.name||"";$("fDay").value=e.day;$("fType").value=e.type||"mine";$("fStart").value=e.start;$("fEnd").value=e.end;$("fFormat").value=e.format||"";$("fRoom").value=e.room||"";$("fTeacher").value=e.teacher||"";$("fDate").value=e.date||"";$("fNote").value=e.note||"";modal.classList.add("open");box.style.transform="translateY(0)"}function openNew(){editingId=null;$("modalBadge").textContent="NOVÁ HODINA";$("modalTitle").textContent="Pridať hodinu";["fName","fFormat","fRoom","fTeacher","fDate","fNote"].forEach(id=>$(id).value="");$("fDay").value="0";$("fType").value="mine";$("fStart").value="08:00";$("fEnd").value="08:45";modal.classList.add("open");box.style.transform="translateY(0)"}function closeModal(){box.style.transform="translateY(0)";modal.classList.remove("open")}
$("add").onclick=openNew;$("cancel").onclick=closeModal;$("save").onclick=()=>{const data={day:+$("fDay").value,start:$("fStart").value,end:$("fEnd").value,name:$("fName").value,type:$("fType").value,format:$("fFormat").value,room:$("fRoom").value,teacher:$("fTeacher").value,date:$("fDate").value,note:$("fNote").value};if(!data.name.trim())return;if(editingId){const i=events.findIndex(e=>e.id===editingId);if(i>=0)events[i]={...events[i],...data}}else events.push({...data,id:crypto.randomUUID?.()??String(Date.now())});saveEvents();closeModal();render()};$("delete").onclick=()=>{if(!editingId)return closeModal();events=events.filter(e=>e.id!==editingId);saveEvents();closeModal();render()};
function setupSheet(hit,target,onClose){let s=null;hit.addEventListener("pointerdown",ev=>{ev.preventDefault();s={y:ev.clientY};target.classList.add("sheet-dragging");try{hit.setPointerCapture(ev.pointerId)}catch{}});hit.addEventListener("pointermove",ev=>{if(!s)return;const dy=Math.max(0,ev.clientY-s.y);target.style.transform=`translateY(${dy}px)`});hit.addEventListener("pointerup",ev=>{if(!s)return;const dy=Math.max(0,ev.clientY-s.y);target.classList.remove("sheet-dragging");s=null;if(dy>70){target.style.transform="translateY(100%)";setTimeout(onClose,170)}else target.style.transform="translateY(0)"})}
setupSheet($("grabHit"),box,closeModal);setupSheet($("titleGrabHit"),titleBox,()=>titleModal.classList.remove("open"));$("scheduleTitle").onclick=()=>{$("fScheduleTitle").value=localStorage.getItem(TITLE_KEY)||"POLM · ZS 2026/27";titleModal.classList.add("open")};$("titleCancel").onclick=()=>titleModal.classList.remove("open");$("titleSave").onclick=()=>{const v=$("fScheduleTitle").value.trim()||"POLM · ZS 2026/27";localStorage.setItem(TITLE_KEY,v);titleModal.classList.remove("open");render()};fillSelects();render();
</script>
