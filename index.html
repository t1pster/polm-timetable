<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c11">
<title>POLM · Timetable</title>
<style>
:root{--bg:#090c11;--panel:#10151d;--panel2:#0d1218;--line:#27303b;--text:#f4f7fa;--muted:#8794a5;--mine1:#294966;--mine2:#3b6b90;--other1:#522833;--other2:#733743;--bad:#ff536d;--dayw:112px;--head:46px;--dayh:178px;--pxm:1.72px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{overflow-x:hidden}.wrap{padding:16px 16px 24px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.title{font-size:20px;font-weight:800;letter-spacing:-.02em}.add{border:0;border-radius:11px;padding:10px 15px;background:#eef3f8;color:#10151d;font-weight:800;font-size:14px;cursor:pointer}.board{overflow:auto hidden;border:1px solid var(--line);border-radius:15px;background:var(--panel);-webkit-overflow-scrolling:touch}.grid{position:relative;width:max-content;min-width:100%;display:grid;grid-template-rows:var(--head) repeat(5,var(--dayh));background:var(--panel)}.corner,.time,.day,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.corner,.time,.day{background:var(--panel2)}.corner{position:sticky;left:0;z-index:8}.time{height:var(--head);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.day{width:var(--dayw);display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-size:11px;font-weight:850;letter-spacing:.08em;position:sticky;left:0;z-index:7}.cell{height:var(--dayh)}
.event{position:absolute;border-radius:12px;padding:10px 11px;overflow:hidden;user-select:none;touch-action:none;cursor:grab;z-index:10;border:1px solid transparent;box-shadow:0 7px 18px #0008;transition:box-shadow .14s,outline .12s,transform .12s;will-change:left,top,width,height,transform;min-width:92px;min-height:58px}.event.dragging{cursor:grabbing;z-index:100;box-shadow:0 18px 38px #000c;transition:none;transform:scale(1.018)}.event.resizing{cursor:grabbing;z-index:110;box-shadow:0 18px 38px #000c;transition:none}.mine{background:linear-gradient(135deg,var(--mine1),var(--mine2));border-color:#4b789b}.other{background:linear-gradient(135deg,var(--other1),var(--other2));border-color:#a24d5d}.event.conflict{outline:3px solid var(--bad);box-shadow:0 0 0 6px #ff536d33,0 18px 38px #000c}.name{font-weight:800;line-height:1.18;letter-spacing:-.01em}.meta{font-size:11px;line-height:1.38;color:#e0e8ef;margin-top:5px}.cross{position:absolute;right:7px;top:3px;color:#ff7b8d;font-size:19px;font-weight:900}.handle{position:absolute;z-index:20}.handle-x{right:-4px;top:10px;bottom:10px;width:12px;cursor:ew-resize}.handle-y{left:10px;right:10px;bottom:-4px;height:12px;cursor:ns-resize}.handle-xy{right:-4px;bottom:-4px;width:16px;height:16px;cursor:nwse-resize}.handle-y:after{content:"";position:absolute;left:40%;right:40%;bottom:4px;height:2px;border-radius:3px;background:#fff8}.handle-x:after{content:"";position:absolute;top:40%;bottom:40%;right:4px;width:2px;border-radius:3px;background:#fff8}.handle-xy:after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid #fff8;border-bottom:2px solid #fff8}.dates{margin-top:5px;font-size:10px;color:#c9d5df;white-space:normal}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:14px;z-index:300}.modal.open{display:flex}.box{width:min(430px,100%);max-height:92vh;overflow:auto;background:#151b24;border:1px solid #303b48;border-radius:17px;padding:17px}.box h2{margin:0 0 14px;font-size:19px}.form{display:grid;gap:9px}.form label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.form input,.form select,.form textarea{width:100%;border:1px solid #303b48;border-radius:9px;background:#0d1218;color:var(--text);padding:9px;font:inherit;outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#6687a3}.form textarea{min-height:58px;resize:vertical}.actions{display:flex;gap:7px;margin-top:14px}.actions button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.cancel{background:#29323d;color:#fff}.delete{background:#63303b;color:#fff}.save{background:#eef3f8;color:#10151d}
@media(max-width:700px){:root{--dayw:92px;--dayh:154px;--pxm:1.65px}.wrap{padding:9px 8px 18px}.title{font-size:16px}.add{padding:9px 12px}.event{padding:8px 9px;border-radius:10px}.name{font-size:12px}.meta{font-size:9.5px;margin-top:4px}.dates{font-size:9px}.board{border-radius:12px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="title">POLM · ZS 2026/27</div><button class="add" id="add">＋ Pridať</button></div><div class="board"><div id="grid" class="grid"></div></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Nová hodina</h2><div class="form">
<div><label>Predmet</label><input id="fName"></div><div><label>Deň</label><select id="fDay"><option value="0">Pondelok</option><option value="1">Utorok</option><option value="2">Streda</option><option value="3">Štvrtok</option><option value="4">Piatok</option></select></div>
<div><label>Začiatok</label><select id="fStart"></select></div><div><label>Koniec</label><select id="fEnd"></select></div><div><label>Označenie</label><select id="fType"><option value="mine">Moja hodina</option><option value="other">×</option></select></div>
<div><label>P/S</label><input id="fFormat"></div><div><label>Miestnosť</label><input id="fRoom"></div><div><label>Vyučujúci</label><input id="fTeacher"></div><div><label>Dátumy</label><input id="fDate"></div><div><label>Moja poznámka</label><textarea id="fNote"></textarea></div>
</div><div class="actions"><button class="cancel" id="cancel">Zrušiť</button><button class="delete" id="delete">Vymazať</button><button class="save" id="save">Uložiť</button></div></div></div>
<script>
const TIMES=["07:10","08:00","08:55","09:45","10:40","11:25","12:25","13:15","14:10","15:00","15:55","16:45","17:35","18:25","19:10","19:55"];
const DAYS=["PONDELOK","UTOROK","STREDA","ŠTVRTOK","PIATOK"],KEY="polm-events-v3";
const raw=[
{day:0,start:"08:00",end:"08:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"28.09.2026; 16.11.2026"},
{day:0,start:"14:10",end:"14:55",name:"Politická filozofia",type:"mine",format:"S",room:"77 IPO",teacher:"doc. Nataliya Maradyk, PhD."},
{day:1,start:"08:00",end:"08:45",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"29.09.2026"},
{day:1,start:"10:40",end:"11:25",name:"Medzinárodná politika I. (profilový predmet) (PP)",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"20.10.2026; 17.11.2026"},
{day:2,start:"08:55",end:"09:40",name:"Teória demokracie I. (profilový predmet) (PP)",type:"mine",format:"P",room:"186 ISJM",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"10:40",end:"11:25",name:"Tolerancia a intolerancia v politike",type:"mine",format:"P",room:"90 Po",teacher:"doc. PhDr. Irina Dudinská, CSc., univer. prof."},
{day:2,start:"11:25",end:"12:10",name:"Textový seminár k problematike globalizácie",type:"mine",format:"S",room:"369 Po",teacher:"doc. Nataliya Maradyk, PhD."},
{day:2,start:"14:10",end:"14:55",name:"Diplomatický protokol a spoločenská etiketa",type:"mine",format:"S",room:"77 IPO",teacher:"Mgr. Gabriel Székely, PhD."},
{day:2,start:"11:25",end:"12:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"P",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:2,start:"12:25",end:"13:10",name:"Dejiny sociálno-politického myslenia v Čechách a na Slovensku",type:"other",format:"S",room:"499 Po",teacher:"Dr. h. c. prof. PhDr. Rudolf Dupkala, CSc."},
{day:3,start:"13:15",end:"14:00",name:"Aplikovaná politológia",type:"mine",format:"P",room:"77 IPO",teacher:"PhDr. Matúš Žac, PhD."},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"S",room:"186 ISJM",teacher:"RNDr. Daniel Kamenský",date:"28.09.2026; 16.11.2026"},
{day:3,start:"14:10",end:"14:55",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"},
{day:3,start:"15:00",end:"15:45",name:"Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín",type:"mine",format:"P",room:"i6p",teacher:"prof. PhDr. Alexander Duleba, CSc.",date:"19.10.2026"}
];
let events=JSON.parse(localStorage.getItem(KEY)||"null")||raw.map((x,i)=>({...x,id:i}));
let editId=null,gesture=null;const $=id=>document.getElementById(id),grid=$("grid"),modal=$("modal");
const toMin=t=>{let[a,b]=t.split(":").map(Number);return a*60+b},minToTime=m=>{m=Math.max(toMin(TIMES[0]),Math.min(toMin(TIMES[TIMES.length-1]),Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const base=toMin(TIMES[0]),ppm=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxm")),dayH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dayh"));
const xFor=m=>112+(m-base)*ppm(),topFor=d=>46+d*dayH(),save=()=>localStorage.setItem(KEY,JSON.stringify(events));
function conflicts(e,day,s,en){return events.some(o=>o.id!==e.id&&o.day===day&&s<toMin(o.end)&&en>toMin(o.start))}
function render(){grid.innerHTML="";let cols=TIMES.slice(0,-1).map((t,i)=>Math.max(76,(toMin(TIMES[i+1])-toMin(t))*ppm())+"px").join(" ");grid.style.gridTemplateColumns="112px "+cols;grid.insertAdjacentHTML("beforeend",'<div class="corner"></div>');TIMES.slice(0,-1).forEach(t=>grid.insertAdjacentHTML("beforeend",`<div class="time">${t}</div>`));DAYS.forEach((d,i)=>{grid.insertAdjacentHTML("beforeend",`<div class="day">${d}</div>`);TIMES.slice(0,-1).forEach(()=>grid.insertAdjacentHTML("beforeend",'<div class="cell"></div>'))});events.forEach(e=>{const s=toMin(e.start),en=toMin(e.end),el=document.createElement("div");el.className=`event ${e.type} ${conflicts(e,e.day,s,en)?"conflict":""}`;el.dataset.id=e.id;el.style.left=xFor(s)+"px";el.style.top=topFor(e.day)+"px";el.style.width=Math.max(92,(en-s)*ppm())+"px";el.style.height=Math.max(58,(en-s)*dayH()/60)+"px";const dates=e.date?`<div class="dates">${esc(e.date)}</div>`:"";el.innerHTML=`${e.type==="other"?'<span class="cross">×</span>':""}<div class="name">${esc(e.name)}</div><div class="meta">${esc(e.format)} · ${esc(e.room)}<br>${esc(e.teacher)}</div>${dates}${e.note?`<div class="dates">• ${esc(e.note)}</div>`:""}<div class="handle handle-x"></div><div class="handle handle-y"></div><div class="handle handle-xy"></div>`;grid.appendChild(el);el.addEventListener("dblclick",()=>openEdit(e.id));el.addEventListener("pointerdown",v=>begin(v,e,el,"move"));el.querySelector(".handle-x").addEventListener("pointerdown",v=>begin(v,e,el,"x"));el.querySelector(".handle-y").addEventListener("pointerdown",v=>begin(v,e,el,"y"));el.querySelector(".handle-xy").addEventListener("pointerdown",v=>begin(v,e,el,"xy"));});}
function begin(ev,e,el,mode){if(ev.button!==undefined&&ev.button!==0)return;ev.preventDefault();ev.stopPropagation();el.setPointerCapture?.(ev.pointerId);gesture={e,el,mode,day:e.day,start:toMin(e.start),end:toMin(e.end),x:ev.clientX,y:ev.clientY};el.classList.add(mode==="move"?"dragging":"resizing");el.addEventListener("pointermove",move);el.addEventListener("pointerup",end,{once:true});el.addEventListener("pointercancel",end,{once:true});}
function move(ev){if(!gesture)return;const g=gesture,dx=ev.clientX-g.x,dy=ev.clientY-g.y;let s=g.start,en=g.end,d=g.day;if(g.mode==="move"){let rawS=g.start+dx/ppm(),rawDay=g.day+Math.round(dy/dayH());s=Math.max(base,Math.min(toMin(TIMES[TIMES.length-2]),Math.round(rawS/5)*5));d=Math.max(0,Math.min(4,rawDay));en=s+(g.end-g.start);g.el.style.left=xFor(s)+"px";g.el.style.top=topFor(d)+"px"}else{if(g.mode==="x"||g.mode==="xy"){en=Math.max(s+30,Math.min(toMin(TIMES[TIMES.length-1]),Math.round((g.end+dx/ppm())/5)*5));g.el.style.width=Math.max(92,(en-s)*ppm())+"px"}if(g.mode==="y"||g.mode==="xy"){let h=Math.max(58,g.el.getBoundingClientRect().height+dy);g.el.style.height=h+"px"}}g.el.classList.toggle("conflict",conflicts(g.e,d,s,en));g.preview={day:d,start:minToTime(s),end:minToTime(en)};}
function end(){if(!gesture)return;const g=gesture;g.el.classList.remove("dragging","resizing");if(g.preview){g.e.day=g.preview.day;g.e.start=g.preview.start;g.e.end=g.preview.end;save();}g.el.removeEventListener("pointermove",move);gesture=null;render();}
function fillSelects(){["fStart","fEnd"].forEach(id=>{$(id).innerHTML=TIMES.map(t=>`<option>${t}</option>`).join("")})}function openEdit(id){editId=id;const e=events.find(x=>x.id===id);$("modalTitle").textContent="Upraviť";$("fName").value=e.name;$("fDay").value=e.day;$("fStart").value=e.start;$("fEnd").value=e.end;$("fType").value=e.type;$("fFormat").value=e.format||"";$("fRoom").value=e.room||"";$("fTeacher").value=e.teacher||"";$("fDate").value=e.date||"";$("fNote").value=e.note||"";$("delete").style.display="block";modal.classList.add("open")}
function openNew(){editId=null;$("modalTitle").textContent="Nová hodina";["fName","fFormat","fRoom","fTeacher","fDate","fNote"].forEach(id=>$(id).value="");$("fDay").value="0";$("fStart").value="08:00";$("fEnd").value="08:45";$("fType").value="mine";$("delete").style.display="none";modal.classList.add("open")}
$("add").onclick=openNew;$("cancel").onclick=()=>modal.classList.remove("open");$("save").onclick=()=>{const data={day:+$("fDay").value,start:$("fStart").value,end:$("fEnd").value,name:$("fName").value.trim()||"Nová hodina",type:$("fType").value,format:$("fFormat").value.trim(),room:$("fRoom").value.trim(),teacher:$("fTeacher").value.trim(),date:$("fDate").value.trim(),note:$("fNote").value.trim()};if(editId===null){data.id=Date.now();events.push(data)}else{Object.assign(events.find(x=>x.id===editId),data)}save();modal.classList.remove("open");render()};$("delete").onclick=()=>{if(editId!==null){events=events.filter(x=>x.id!==editId);save();render()}modal.classList.remove("open")};modal.addEventListener("pointerdown",e=>{if(e.target===modal)modal.classList.remove("open")});fillSelects();render();
</script>
</body></html>
