<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c11">
<title>POLM Timetable</title>
<style>
:root{--bg:#090c11;--panel:#10151d;--line:#27303b;--text:#f4f7fa;--muted:#8e9aaa;--mine:#294966;--mine2:#355e7f;--other:#542934;--bad:#ff6175;--cell:72px;--day:112px;--head:42px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:16px;min-width:1200px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:19px;font-weight:750}.add{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#eef3f8;color:#10151d}
.grid{position:relative;display:grid;grid-template-columns:var(--day) repeat(15,var(--cell));grid-template-rows:var(--head) repeat(5,155px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.corner,.time,.day{background:#0d1218;border-bottom:1px solid var(--line)}.corner{border-right:1px solid var(--line)}.time{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-right:1px solid var(--line)}.day{display:flex;justify-content:center;padding-top:14px;font-size:11px;font-weight:800;letter-spacing:.08em;border-right:1px solid var(--line)}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.event{position:absolute;border-radius:10px;padding:8px 9px;overflow:hidden;user-select:none;touch-action:none;cursor:grab;transition:box-shadow .12s,transform .08s;border:1px solid transparent;box-shadow:0 5px 14px #0006}
.event.dragging{cursor:grabbing;z-index:100;box-shadow:0 16px 35px #000b;transition:none}.mine{background:linear-gradient(135deg,var(--mine),var(--mine2));border-color:#4b7698}.other{background:linear-gradient(135deg,var(--other),#6a3440);border-color:#a34e5d}.event.conflict{outline:3px solid var(--bad);box-shadow:0 0 0 6px #ff617533,0 16px 35px #000b}
.name{font-weight:750;line-height:1.17;padding-right:15px}.meta{font-size:10.5px;line-height:1.35;color:#dce6ee;margin-top:4px}.cross{position:absolute;right:7px;top:3px;color:#ff7889;font-size:18px;font-weight:800}.handle{position:absolute;left:8px;right:8px;bottom:1px;height:10px;cursor:ns-resize}.handle:after{content:"";position:absolute;left:35%;right:35%;bottom:4px;height:2px;border-radius:2px;background:#ffffff70}
.modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:16px;z-index:300}.box{width:min(430px,100%);max-height:92vh;overflow:auto;background:#151b24;border:1px solid #303a47;border-radius:16px;padding:17px}.box h2{margin:0 0 14px;font-size:18px}.form{display:grid;gap:9px}.form label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.form input,.form select,.form textarea{width:100%;border:1px solid #303a47;border-radius:9px;background:#0d1218;color:var(--text);padding:9px;font:inherit}.form textarea{min-height:55px;resize:vertical}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:700}.cancel{background:#29323d;color:#fff}.delete{background:#63303b;color:#fff}.save{background:#eef3f8;color:#10151d}
@media(max-width:700px){.wrap{padding:8px}.top{margin-bottom:8px}.title{font-size:16px}.grid{--cell:68px;--day:98px;grid-template-rows:40px repeat(5,145px)}.event{padding:7px;font-size:12px}.meta{font-size:9.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title">POLM · ZS 2026/27</div><button class="add" id="add">＋ Pridať</button></div>
  <div id="grid" class="grid"></div>
</div>

<div id="modal" class="modal">
 <div class="box">
  <h2 id="modalTitle">Nová hodina</h2>
  <div class="form">
   <div><label>Predmet</label><input id="fName"></div>
   <div><label>Deň</label><select id="fDay"><option value="0">Pondelok</option><option value="1">Utorok</option><option value="2">Streda</option><option value="3">Štvrtok</option><option value="4">Piatok</option></select></div>
   <div><label>Začiatok</label><select id="fStart"></select></div>
   <div><label>Koniec</label><select id="fEnd"></select></div>
   <div><label>Označenie</label><select id="fType"><option value="mine">Moja hodina</option><option value="other">×</option></select></div>
   <div><label>P/S</label><input id="fFormat"></div>
   <div><label>Miestnosť</label><input id="fRoom"></div>
   <div><label>Vyučujúci</label><input id="fTeacher"></div>
   <div><label>Dátum</label><input id="fDate"></div>
   <div><label>Moja poznámka</label><textarea id="fNote"></textarea></div>
  </div>
  <div class="actions"><button class="cancel" id="cancel">Zrušiť</button><button class="delete" id="delete">Vymazať</button><button class="save" id="save">Uložiť</button></div>
 </div>
</div>

<script>
const TIMES=["07:10","08:00","08:55","09:45","10:40","11:25","12:25","13:15","14:10","15:00","15:55","16:45","17:35","18:25","19:10","19:55"];
const DAYS=["PONDELOK","UTOROK","STREDA","ŠTVRTOK","PIATOK"];
const raw=[
[0,"08:00","08:45","Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","28.09.2026",""],
[0,"08:00","08:45","Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","16.11.2026",""],
[0,"14:10","14:55","Politická filozofia","mine","S","77 IPO","doc. Nataliya Maradyk, PhD.","",""],
[1,"08:00","08:45","Medzinárodná politika I. (profilový predmet) (PP)","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","29.09.2026",""],
[1,"10:40","11:25","Medzinárodná politika I. (profilový predmet) (PP)","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","29.09.2026",""],
[1,"10:40","11:25","Medzinárodná politika I. (profilový predmet) (PP)","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","20.10.2026",""],
[1,"10:40","11:25","Medzinárodná politika I. (profilový predmet) (PP)","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","17.11.2026",""],
[2,"08:55","09:40","Teória demokracie I. (profilový predmet) (PP)","mine","P","i6p","doc. PhDr. Miroslav Nemec, PhD.","",""],
[2,"10:40","11:25","Tolerancia a intolerancia v politike","mine","S","i6p","doc. Mgr. Martin Zajac, PhD.","",""],
[2,"11:25","12:10","Textový seminár k problematike globalizácie","mine","P","i6p","Mgr. Matej Pitner","",""],
[2,"12:25","13:10","Textový seminár k problematike globalizácie","mine","P","i6p","Mgr. Matej Pitner","",""],
[2,"13:15","14:00","Textový seminár k problematike globalizácie","mine","P","i6p","Mgr. Matej Pitner","",""],
[2,"14:10","14:55","Diplomatický protokol a spoločenská etiketa","mine","P","i6p","Mgr. Ivana Iľkiv, PhD.","",""],
[2,"15:00","15:45","Diplomatický protokol a spoločenská etiketa","mine","P","i6p","Mgr. Ivana Iľkiv, PhD.","",""],
[2,"11:25","12:10","Dejiny sociálno-politického myslenia v Čechách a na Slovensku","other","P","i6p","doc. Mgr. Martin Kaľavský, PhD.","",""],
[2,"12:25","13:10","Dejiny sociálno-politického myslenia v Čechách a na Slovensku","other","S","i6p","doc. Mgr. Martin Kaľavský, PhD.","",""],
[3,"13:15","14:00","Aplikovaná politológia","mine","S","i6p","PhDr. Ján Krištofík, PhD.","",""],
[3,"14:10","14:55","Aplikovaná politológia","mine","S","i6p","PhDr. Ján Krištofík, PhD.","",""],
[3,"15:00","15:45","Aplikovaná politológia","mine","S","i6p","PhDr. Ján Krištofík, PhD.","",""],
[3,"14:10","14:55","Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","19.10.2026",""],
[3,"15:00","15:45","Východná Európa po rozpade ZSSR: vnútorná a zahraničná politika vybraných krajín","mine","P","i6p","prof. PhDr. Alexander Duleba, CSc.","19.10.2026",""]
];
let events=JSON.parse(localStorage.getItem("polm-events")||"null")||raw.map((x,i)=>({id:i,day:x[0],start:x[1],end:x[2],name:x[3],type:x[4],format:x[5],room:x[6],teacher:x[7],date:x[8],note:x[9]}));
let editId=null, gesture=null;
const $=id=>document.getElementById(id), grid=$("grid"), modal=$("modal");
const toMin=t=>{let [h,m]=t.split(":").map(Number);return h*60+m};
const nearest=m=>TIMES.reduce((a,t)=>Math.abs(toMin(t)-m)<Math.abs(toMin(a)-m)?t:a,TIMES[0]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function conflict(e,day,start,end){return events.some(o=>o.id!==e.id&&o.day===day&&start<toMin(o.end)&&end>toMin(o.start))}
function persist(){localStorage.setItem("polm-events",JSON.stringify(events))}
function render(){
 grid.innerHTML='<div class="corner"></div>'+TIMES.slice(0,-1).map(t=>`<div class="time">${t}</div>`).join("");
 DAYS.forEach((d,i)=>{grid.insertAdjacentHTML("beforeend",`<div class="day">${d}</div>`);TIMES.slice(0,-1).forEach(()=>grid.insertAdjacentHTML("beforeend",'<div class="cell"></div>'))});
 events.forEach(e=>{
  const el=document.createElement("div"), start=toMin(e.start), end=toMin(e.end), base=toMin(TIMES[0]);
  el.className=`event ${e.type}`;el.dataset.id=e.id;
  el.style.left=(112+(start-base)/55*72)+"px";
  el.style.top=(42+e.day*155+(start-base)/55*155)+"px";
  el.style.width="66px";el.style.height=Math.max(38,(end-start)/55*155)+"px";
  el.innerHTML=`${e.type==="other"?'<span class="cross">×</span>':""}<div class="name">${esc(e.name)}</div><div class="meta">${esc(e.format)} · ${esc(e.room)}<br>${esc(e.teacher)}${e.date?"<br>"+esc(e.date):""}${e.note?"<br>• "+esc(e.note):""}</div><div class="handle"></div>`;
  grid.appendChild(el);
  el.addEventListener("dblclick",()=>openEdit(e.id));
  el.addEventListener("pointerdown",ev=>begin(ev,e,el,false));
  el.querySelector(".handle").addEventListener("pointerdown",ev=>begin(ev,e,el,true));
 });
}
function begin(ev,e,el,resize){
 ev.preventDefault();ev.stopPropagation();el.setPointerCapture(ev.pointerId);el.classList.add("dragging");
 gesture={evId:ev.pointerId,e,el,resize,x:ev.clientX,y:ev.clientY,day:e.day,start:toMin(e.start),end:toMin(e.end),previewDay:e.day,previewStart:toMin(e.start),previewEnd:toMin(e.end)};
 el.addEventListener("pointermove",move);el.addEventListener("pointerup",finish,{once:true});
}
function move(ev){
 if(!gesture)return;
 const g=gesture, dx=ev.clientX-g.x, dy=ev.clientY-g.y, d=g.e;
 if(g.resize){
  let n=Math.round((g.end+dy/155*55)/5)*5;n=Math.max(toMin(d.start)+30,Math.min(toMin(TIMES.at(-1)),n));g.previewEnd=n;
  g.el.style.height=Math.max(38,(n-toMin(d.start))/55*155)+"px";
 }else{
  let nd=Math.max(0,Math.min(4,g.day+Math.round(dy/155))), ns=Math.round((g.start+dx/72*55)/5)*5;
  const dur=g.end-g.start;ns=Math.max(toMin(TIMES[0]),Math.min(toMin(TIMES.at(-1))-dur,ns));
  g.previewDay=nd;g.previewStart=ns;g.el.style.transform=`translate(${dx}px,${dy}px)`;
 }
 const a=g.resize?g.previewEnd:g.previewStart+(g.end-g.start), b=g.resize?g.start:g.previewStart;
 g.el.classList.toggle("conflict",conflict(d,g.resize?d.day:g.previewDay,b,a));
}
function finish(){
 const g=gesture;if(!g)return;const d=g.e;
 if(!g.el.classList.contains("conflict")){
  if(g.resize)d.end=nearest(g.previewEnd);
  else{d.day=g.previewDay;d.start=nearest(g.previewStart);d.end=nearest(g.previewStart+(g.end-g.start));}
  persist();
 }
 g.el.classList.remove("dragging","conflict");g.el.style.transform="";gesture=null;render();
}
function fill(){
 ["fStart","fEnd"].forEach(id=>$(id).innerHTML=TIMES.slice(0,-1).map(t=>`<option>${t}</option>`).join(""));
}
function openEdit(id){
 editId=id;const e=events.find(x=>x.id===id);$("modalTitle").textContent="Upraviť hodinu";
 ["name","day","start","end","type","format","room","teacher","date","note"].forEach(k=>$("f"+k[0].toUpperCase()+k.slice(1)).value=e[k]??"");
 $("delete").style.display="block";modal.style.display="flex";
}
function openAdd(){
 editId=null;$("modalTitle").textContent="Nová hodina";
 ["Name","Format","Room","Teacher","Date","Note"].forEach(k=>$("f"+k).value="");
 $("fDay").value="0";$("fStart").value="08:00";$("fEnd").value="08:45";$("fType").value="mine";$("delete").style.display="none";modal.style.display="flex";
}
$("add").onclick=openAdd;$("cancel").onclick=()=>modal.style.display="none";
$("delete").onclick=()=>{events=events.filter(e=>e.id!==editId);persist();modal.style.display="none";render()};
$("save").onclick=()=>{
 const e={id:editId??Date.now(),name:$("fName").value,day:+$("fDay").value,start:$("fStart").value,end:$("fEnd").value,type:$("fType").value,format:$("fFormat").value,room:$("fRoom").value,teacher:$("fTeacher").value,date:$("fDate").value,note:$("fNote").value};
 if(toMin(e.end)<=toMin(e.start))return alert("Koniec musí byť neskôr ako začiatok.");
 if(conflict(e,e.day,toMin(e.start),toMin(e.end)))return alert("Tento čas sa prekrýva s inou hodinou.");
 if(editId===null)events.push(e);else events=events.map(x=>x.id===editId?e:x);
 persist();modal.style.display="none";render();
};
fill();render();
</script>
</body>
</html>
